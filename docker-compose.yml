services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: navalha
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["navalha_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d navalha"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  navalha_data:
